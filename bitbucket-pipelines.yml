# bitbucket-pipelines.yml
# Purpose: On changes to tokens/_settings.scss, either:
# - Normal release: create immutable vX.Y(.Z) tag + update moving alias (vX) + purge jsDelivr
# - Override: move a selected tag (e.g., v2.15 or v2) without bumping and purge jsDelivr

pipelines:
  branches:
    main:
      - step:
          name: Release or Override tokens
          image: alpine:3.20
          script:
            - set -euo pipefail
            - apk add --no-cache git curl jq sed grep bash
            - git config --global user.name "jenkins"
            - git config --global user.email "integrator@businessfacilitation.org"
            - git fetch --tags

            # 1) Extract declared version from SCSS
            - VER=$(grep -Eo '^\$tokens-version:\s*"[^"]+"' tokens/_settings.scss | sed -E 's/.*"([^"]+)".*/\1/')
            - echo "Detected version: $VER"
            - [[ "$VER" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]

            # 2) Detect if the file changed in this commit
            - |
              if ! git diff --name-only HEAD~1..HEAD | grep -q '^tokens/_settings.scss$'; then
                echo "No changes to tokens/_settings.scss; skipping." ; exit 0 ; fi

            # 3) Mirror to GitHub (so jsDelivr can serve)
            - GH="https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPO}.git"
            - git remote add github "$GH" || true
            - git push github HEAD:main

            # Behavior switches:
            #   OVERRIDE=true   -> move SELECTED_TAG without bumping
            #   SELECTED_TAG    -> which tag to move (e.g., v2 or v2.15). Defaults to v2 when overriding.
            # Normal (no OVERRIDE): create immutable v$VER if new; also update moving major (v${VER%%.*})
            - |
              if [ "${OVERRIDE:-false}" = "true" ]; then
                SEL="${SELECTED_TAG:-v${VER%%.*}}"
                echo "OVERRIDE mode: moving tag $SEL to HEAD"
                git tag -f "$SEL"
                git push -f github "$SEL"
                # Purge jsDelivr for overridden tag
                curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPO}@${SEL}/tokens/_settings.scss" || true
                exit 0
              fi

            # 4) Normal release: immutable vX.Y(.Z) + moving major alias (vX)
            - IMMUT="v$VER"
            - MAJOR="v${VER%%.*}"

            # Create immutable tag if not exists
            - |
              if git rev-parse -q --verify "refs/tags/$IMMUT" >/dev/null; then
                echo "Immutable tag $IMMUT already exists (no retag)."
              else
                git tag -a "$IMMUT" -m "Release $IMMUT (tokens)"
                git push github "$IMMUT"
              fi

            # Move major alias to HEAD
            - git tag -f "$MAJOR"
            - git push -f github "$MAJOR"

            # 5) Purge jsDelivr caches for the immutable tag and the moving alias
            - curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPO}@${IMMUT}/tokens/_settings.scss" || true
            - curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPO}@${MAJOR}/tokens/_settings.scss" || true
