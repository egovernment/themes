# /bitbucket-pipelines.yml
# Purpose: On every build, mirror to GitHub, tag using VER from variables.scss
# (create or force-move the tag), then purge jsDelivr for that tag+file.
# Note: GitHub repo must be public for jsDelivr to fetch.

image: alpine:3.20

clone:
  depth: full

pipelines:
  branches:
    "main":
      - step:
          name: Publish tokens to jsDelivr (version-as-tag)
          script:
            - |
              set -eu
              apk add --no-cache git curl sed grep

              # Read VER from SCSS (expects: $tokens-version: "2.13")
              FILE="variables.scss"
              VER=$(grep -Eo '^\$tokens-version:\s*"[^"]+"' "$FILE" | sed -E 's/.*"([^"]+)".*/\1/')
              echo "Detected VER: $VER"
              echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$' || { echo "Invalid VER: $VER"; exit 1; }

              # Mirror Bitbucket -> GitHub (jsDelivr serves GitHub)
              : "${GITHUB_PAT:?Set repo variable GITHUB_PAT}"
              : "${GITHUB_REPO:?Set repo variable GITHUB_REPO in form org/repo}"
              git config --global user.name "jenkins"
              git config --global user.email "integrator@businessfacilitation.org"
              git fetch --tags || true
              GH="https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPO}.git"

              # Ensure the 'github' remote ALWAYS uses the PAT URL
              if git remote | grep -qx github; then
                git remote set-url github "$GH"
              else
                git remote add github "$GH"
              fi

              # Sanity check: verify we can talk to GitHub with these creds
              git ls-remote github >/dev/null 2>&1 || { echo "Auth failed for ${GITHUB_REPO}. Check PAT scope and access."; exit 1; }

              # Branch name used by CDN alias (avoid collision with tags)
              BR="ver/${VER}"

              # Create/update the GitHub branch to point at current commit (force-move ok for moving alias)
              # Push HEAD directly without creating a local branch:
              git push -f github HEAD:"refs/heads/${BR}"

              # Purge jsDelivr cache for this exact ref and file
              curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPO}@v${BR}/${FILE}" || true

              echo "Published ${FILE} at jsDelivr ref @${VER}"